general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/Pictures/wallpapers/current
    blur_passes = 2
    blur_size = 6
    brightness = 0.6
}

label {
    monitor = 
    text = $TIME
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    color = rgba(205, 214, 244, 1.0)
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = Hi, $USER
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    color = rgba(166, 173, 200, 1.0)
    position = 0, 40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    outer_color = rgba(137, 180, 250, 1.0)
    inner_color = rgba(30, 30, 46, 0.9)
    font_color = rgba(205, 214, 244, 1.0)
    check_color = rgba(249, 226, 175, 1.0)
    fail_color = rgba(243, 139, 168, 1.0)
    placeholder_text = password...
    fail_text = $FAIL ($ATTEMPTS)
    rounding = 10
    position = 0, -40
    halign = center
    valign = center
}
